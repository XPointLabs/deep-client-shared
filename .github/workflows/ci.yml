name: shared-ci

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  test:
    name: test-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Apple client validation is intentionally deferred until the operator
        # explicitly re-enables the Apple platform sprint.
        include:
          - os: ubuntu-latest
          - os: windows-2022
    steps:
      # ContactAccept custody tests consume the current frozen vector corpus
      # from the sibling root docs tree. Pin the same cross-protocol snapshot
      # as Protocol CI; no synthetic route or missing-input skip is permitted.
      - name: Checkout pinned ContactAccept specification input
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/deep-platform
          ref: 9f6d123f95583763d3fe99c266fd4ab83ae37cc5
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            docs/survival-program/releases/v3.0.0/specs/contact-codec-v1.vectors.json
      - uses: actions/checkout@v4
        with:
          path: deep-client-shared
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/deep-protocol
          ref: ${{ github.ref_name }}
          token: ${{ secrets.XPOINTLABS_CI_TOKEN || github.token }}
          path: deep-protocol
      - uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
        with:
          dotnet-version: 10.0.301
      # The Session-derived test project belongs to the pre-cutover source
      # corpus. Gate the current clean production assembly and its migrated
      # mailbox/message tests instead of compiling a removed ClientRuntime.
      - run: dotnet restore Deep.Client.Shared.Production.slnx
        working-directory: deep-client-shared
      - name: Build current production test graph
        run: dotnet build Deep.Client.Shared.Production.slnx --configuration Release --no-restore -m:1 --verbosity quiet
        working-directory: deep-client-shared
      - name: Check approved Windows fixture prerequisites before full
        if: runner.os == 'Windows'
        run: dotnet test Deep.Client.Shared.Production.slnx --configuration Release --no-build --no-restore -m:1 --filter "FixturePreflight=true"
        working-directory: deep-client-shared
      - name: Check portable fixture prerequisites before full
        if: runner.os != 'Windows'
        run: dotnet test Deep.Client.Shared.Production.slnx --configuration Release --no-build --no-restore -m:1 --filter "FixturePreflight=true&RequiresApprovedMlKemRuntime!=true"
        working-directory: deep-client-shared
      - name: Test complete approved Windows runtime surface
        if: runner.os == 'Windows'
        run: dotnet test Deep.Client.Shared.Production.slnx --configuration Release --no-build --no-restore -m:1
        working-directory: deep-client-shared
      - name: Test portable surface without Windows-only approved ML-KEM runtime
        if: runner.os != 'Windows'
        run: dotnet test Deep.Client.Shared.Production.slnx --configuration Release --no-build --no-restore -m:1 --filter "RequiresApprovedMlKemRuntime!=true"
        working-directory: deep-client-shared
