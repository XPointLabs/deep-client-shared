name: shared-ci

on:
  push:
  pull_request:

jobs:
  test:
    name: test-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          path: deep-client-shared
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/deep-protocol
          ref: ${{ github.ref_name }}
          token: ${{ secrets.XPOINTLABS_CI_TOKEN }}
          path: deep-protocol
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.301
      - run: dotnet restore Deep.Client.Shared.slnx
        working-directory: deep-client-shared
      - name: Test complete approved Windows runtime surface
        if: runner.os == 'Windows'
        run: dotnet test Deep.Client.Shared.slnx --configuration Release --no-restore -m:1
        working-directory: deep-client-shared
      - name: Test portable surface without Windows-only approved ML-KEM runtime
        if: runner.os != 'Windows'
        run: dotnet test Deep.Client.Shared.slnx --configuration Release --no-restore -m:1 --filter "RequiresApprovedMlKemRuntime!=true"
        working-directory: deep-client-shared

  package-placeholder:
    name: build-shared-artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: deep-client-shared
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/deep-protocol
          ref: ${{ github.ref_name }}
          token: ${{ secrets.XPOINTLABS_CI_TOKEN }}
          path: deep-protocol
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.301
      - run: dotnet pack src/Deep.Client.Shared/Deep.Client.Shared.csproj --configuration Release --output artifacts
        working-directory: deep-client-shared
      - run: echo "Signing placeholder. Wire repository secrets and signing identity here." > artifacts/SIGNING-PLACEHOLDER.txt
        working-directory: deep-client-shared
      - uses: actions/upload-artifact@v4
        with:
          name: deep-client-shared
          path: deep-client-shared/artifacts
